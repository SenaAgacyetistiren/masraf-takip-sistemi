<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masraf & Süreç Takip Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
        <div>
            <h2 class="text-primary fw-bold mb-0"><i class="bi bi-wallet2 me-2"></i>Masraf & Onay Yönetim Portalı</h2>
            <small class="text-muted">BPMN Tabanlı Dinamik Onay ve Ödeme İş Akışı</small>
        </div>
        <span class="badge bg-dark px-3 py-2">YBS Portföy Projesi</span>
    </header>

    <div class="row g-4">
        <!-- Sol Panel: Yeni Masraf Talep Formu -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold py-3">
                    <i class="bi bi-plus-circle text-primary me-2"></i>Yeni Masraf Talebi Girişi
                </div>
                <div class="card-body">
                    <form id="masrafForm">
                        <div class="mb-3">
                            <label class="form-label">Çalışan Adı Soyadı</label>
                            <input type="text" id="calisan_adi" class="form-control" placeholder="Örn: Sena Yılmaz" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Masraf Kategorisi</label>
                            <select id="kategori" class="form-select" required>
                                <option value="Ulaşım">Ulaşım / Seyahat</option>
                                <option value="Yemek">Müşteri Ağırlama / Yemek</option>
                                <option value="Donanım">Teknoloji / Donanım</option>
                                <option value="Eğitim">Eğitim & Sertifika</option>
                                <option value="Diğer">Diğer Operasyonel</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tutar (TL)</label>
                            <div class="input-group">
                                <span class="input-group-text">₺</span>
                                <input type="number" id="tutar" class="form-control" placeholder="Örn: 3500" step="0.01" required>
                            </div>
                            <small class="text-muted d-block mt-1">> 5.000 TL ise Finans Çift Onayı gerekir.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Açıklama</label>
                            <textarea id="aciklama" class="form-control" rows="2" placeholder="Masraf detayını giriniz..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="bi bi-send-check me-1"></i>Talebi Gönder
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Sağ Panel: Masraf Talepleri Listesi & Durum Yönetimi -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                    <span class="fw-bold"><i class="bi bi-table text-primary me-2"></i>Talepler ve Süreç Takibi</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="talepleriGetir()">
                        <i class="bi bi-arrow-clockwise"></i> Yenile
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Çalışan</th>
                                    <th>Kategori & Detay</th>
                                    <th>Tutar</th>
                                    <th>Onay Akışı</th>
                                    <th>Durum</th>
                                    <th class="text-center">İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="talepListesi">
                                <tr><td colspan="7" class="text-center py-4">Talepler yükleniyor...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function talepleriGetir() {
    try {
        const res = await fetch('/talepler/');
        const talepler = await res.json();
        const tbody = document.getElementById('talepListesi');
        tbody.innerHTML = '';

        if (talepler.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Henüz kayıtlı masraf talebi bulunmamaktadır.</td></tr>';
            return;
        }

        talepler.forEach(t => {
            let durumBadge = '';
            if (t.durum === 'ONAY_BEKLIYOR') durumBadge = '<span class="badge bg-warning text-dark">Onay Bekliyor</span>';
            else if (t.durum === 'ONAYLANDI') durumBadge = '<span class="badge bg-info text-dark">Onaylandı (Ödeme Bekliyor)</span>';
            else if (t.durum === 'ODENDI') durumBadge = '<span class="badge bg-success">Ödendi / Kapandı</span>';
            else if (t.durum === 'REDDEDILDI') durumBadge = '<span class="badge bg-danger">Reddedildi</span>';

            let aksiyonButonlari = '';
            if (t.durum === 'ONAY_BEKLIYOR') {
                aksiyonButonlari = `
                    <button class="btn btn-sm btn-success me-1" onclick="durumGuncelle(${t.id}, 'ONAYLANDI')"><i class="bi bi-check-lg"></i> Onayla</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="durumGuncelle(${t.id}, 'REDDEDILDI')"><i class="bi bi-x-lg"></i> Reddet</button>
                `;
            } else if (t.durum === 'ONAYLANDI') {
                aksiyonButonlari = `
                    <button class="btn btn-sm btn-primary" onclick="ode(${t.id})"><i class="bi bi-cash-stack"></i> Öde</button>
                `;
            } else {
                aksiyonButonlari = `<span class="text-muted small">Tamamlandı</span>`;
            }

            const satir = `
                <tr>
                    <td class="fw-bold">#${t.id}</td>
                    <td>${t.calisan_adi}</td>
                    <td>
                        <span class="badge bg-secondary">${t.kategori}</span>
                        <div class="small text-muted">${t.aciklama || '-'}</div>
                    </td>
                    <td class="fw-bold text-nowrap">₺ ${parseFloat(t.tutar).toLocaleString('tr-TR', {minimumFractionDigits: 2})}</td>
                    <td><small class="text-muted">${t.onay_turu}</small></td>
                    <td>${durumBadge}</td>
                    <td class="text-center text-nowrap">${aksiyonButonlari}</td>
                </tr>
            `;
            tbody.innerHTML += satir;
        });
    } catch (err) {
        console.error("Hata:", err);
    }
}

document.getElementById('masrafForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const veri = {
        calisan_adi: document.getElementById('calisan_adi').value,
        kategori: document.getElementById('kategori').value,
        tutar: parseFloat(document.getElementById('tutar').value),
        aciklama: document.getElementById('aciklama').value
    };

    const res = await fetch('/talepler/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(veri)
    });

    if (res.ok) {
        document.getElementById('masrafForm').reset();
        talepleriGetir();
    } else {
        alert("Kayıt oluşturulurken bir hata oluştu!");
    }
});

async function durumGuncelle(id, durum) {
    const res = await fetch(`/talepler/${id}/onay`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ durum: durum, red_nedeni: durum === 'REDDEDILDI' ? 'Bütçe aşıldı' : null })
    });
    if (res.ok) talepleriGetir();
}

async function ode(id) {
    const res = await fetch(`/talepler/${id}/ode`, { method: 'PUT' });
    if (res.ok) talepleriGetir();
}

// Sayfa açıldığında talepleri yükle
talepleriGetir();
</script>

</body>
</html>
